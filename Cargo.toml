[package]
name = "ws_session"
version = "0.1.0"
edition = "2021"

[lib]
name = "ws_session"
path = "src/lib.rs"

[[bin]]
name = "live"
path = "src/main.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "signal", "sync"] }
tokio-tungstenite = { version = "0.21", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rust_decimal = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "signal", "sync"] }
